			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Build Libraries (Nim + SDL2)";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\ncd \"$SRCROOT\"\nsource env.sh\nREPO=\"$(cd \"$SRCROOT/..\" && pwd)\"\nexport PATH=\"$HOME/.nimble/bin:$HOME/.choosenim/toolchains/nim-2.2.10/bin:$PATH\"\n\nSDK=iphoneos\nARCH=\"${ARCHS%% *}\"\nSYSROOT=\"$(xcrun --sdk \"$SDK\" --show-sdk-path)\"\nMIN=\"$MIN_IOS\"\nMIN_FLAG=\"-mios-version-min=$MIN\"\nOUT=\"$SRCROOT/out/$SDK\"\nmkdir -p \"$OUT\"\n\necho \"==> Nim -> libfodpr.a\"\nif ! nim c -d:release --os:ios --cpu:\"$ARCH\" --app:staticlib --cc:clang --threads:on \\\n  --dynlibOverride:SDL2 \\\n  --nimcache:\"$OUT/nimcache\" \\\n  --path:\"$REPO/src\" \\\n  --passC:\"-arch $ARCH -isysroot $SYSROOT -I$SDL_SRC/include $MIN_FLAG -Wno-unused-command-line-argument\" \\\n  --out:\"$OUT/libfodpr.a\" \\\n  \"$REPO/examples/chat_client.nim\" >\"$OUT/nim.log\" 2>&1; then\n  echo \"ERROR: nim build failed:\"\n  cat \"$OUT/nim.log\"\n  exit 1\nfi\nif [ ! -f \"$OUT/libfodpr.a\" ]; then\n  echo \"ERROR: libfodpr.a was not produced\"\n  exit 1\nfi\n\necho \"==> SDL2 -> libSDL2.a\"\nSDL_SYMROOT=\"$OUT/sdl-symroot\"\nif ! xcodebuild -quiet -project \"$SDL_SRC/Xcode/SDL/SDL.xcodeproj\" \\\n  -target \"Static Library-iOS\" -configuration Release -sdk \"$SDK\" \\\n  -arch \"$ARCH\" ONLY_ACTIVE_ARCH=YES \\\n  SYMROOT=\"$SDL_SYMROOT\" OBJROOT=\"$SDL_SYMROOT/obj\" \\\n  build >\"$OUT/sdl.log\" 2>&1; then\n  echo \"ERROR: SDL2 build failed:\"\n  tail -40 \"$OUT/sdl.log\"\n  exit 1\nfi\nSDL_LIB=\"$(find \"$SDL_SYMROOT\" -name \"libSDL2.a\" -path \"*$SDK*\" | head -1)\"\nif [ -z \"$SDL_LIB\" ] || [ ! -f \"$SDL_LIB\" ]; then\n  echo \"ERROR: libSDL2.a not found under $SDL_SYMROOT\"\n  exit 1\nfi\ncp \"$SDL_LIB\" \"$OUT/libSDL2.a\"\n\necho \"==> Libraries ready: $OUT/libfodpr.a, $OUT/libSDL2.a\"\n";
		};
