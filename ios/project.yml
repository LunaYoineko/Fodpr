name: FodprChat
options:
  bundleIdPrefix: com.fodpr.chat
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

targets:
  FodprChat:
    type: application
    platform: iOS
    sources:
      - path: App/stub.c
    settings:
      base:
        PRODUCT_NAME: FodprChat
        PRODUCT_BUNDLE_IDENTIFIER: com.fodpr.chat
        INFOPLIST_FILE: FodprChat/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_STYLE: Automatic
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/out/iphoneos"
        OTHER_LDFLAGS:
          - $(inherited)
          - "-all_load"
          - "-lfodpr"
          - "-lSDL2"
          - "-framework AVFoundation"
          - "-framework AudioToolbox"
          - "-framework CoreGraphics"
          - "-framework CoreHaptics"
          - "-framework CoreMotion"
          - "-framework Foundation"
          - "-framework GameController"
          - "-framework Metal"
          - "-framework OpenGLES"
          - "-framework QuartzCore"
          - "-framework UIKit"
          - "-framework CoreAudio"
          - "-framework CoreVideo"
          - "-framework CoreBluetooth"
          - "-framework Security"
    preBuildScripts:
      - name: Build Libraries (Nim + SDL2)
        shell: /bin/bash
        script: |
          set -euo pipefail
          cd "$SRCROOT"
          source env.sh
          REPO="$(cd "$SRCROOT/.." && pwd)"
          export PATH="$HOME/.nimble/bin:$HOME/.choosenim/toolchains/nim-2.2.10/bin:$PATH"

          SDK=iphoneos
          ARCH="${ARCHS%% *}"
          SYSROOT="$(xcrun --sdk "$SDK" --show-sdk-path)"
          MIN="$MIN_IOS"
          MIN_FLAG="-mios-version-min=$MIN"
          OUT="$SRCROOT/out/$SDK"
          mkdir -p "$OUT"

          echo "==> Nim -> libfodpr.a"
          if ! nim c -d:release --os:ios --cpu:"$ARCH" --app:staticlib --cc:clang --threads:on \
            --dynlibOverride:SDL2 \
            --nimcache:"$OUT/nimcache" \
            --path:"$REPO/src" \
            --passC:"-arch $ARCH -isysroot $SYSROOT -I$SDL_SRC/include $MIN_FLAG -Wno-unused-command-line-argument" \
            --out:"$OUT/libfodpr.a" \
            "$REPO/examples/chat_client.nim" >"$OUT/nim.log" 2>&1; then
            echo "ERROR: nim build failed:"
            cat "$OUT/nim.log"
            exit 1
          fi
          if [ ! -f "$OUT/libfodpr.a" ]; then
            echo "ERROR: libfodpr.a was not produced"
            exit 1
          fi

          echo "==> SDL2 -> libSDL2.a"
          SDL_SYMROOT="$OUT/sdl-symroot"
          if ! xcodebuild -quiet -project "$SDL_SRC/Xcode/SDL/SDL.xcodeproj" \
            -target "Static Library-iOS" -configuration Release -sdk "$SDK" \
            -arch "$ARCH" ONLY_ACTIVE_ARCH=YES \
            SYMROOT="$SDL_SYMROOT" OBJROOT="$SDL_SYMROOT/obj" \
            build >"$OUT/sdl.log" 2>&1; then
            echo "ERROR: SDL2 build failed:"
            tail -40 "$OUT/sdl.log"
            exit 1
          fi
          SDL_LIB="$(find "$SDL_SYMROOT" -name "libSDL2.a" -path "*$SDK*" | head -1)"
          if [ -z "$SDL_LIB" ] || [ ! -f "$SDL_LIB" ]; then
            echo "ERROR: libSDL2.a not found under $SDL_SYMROOT"
            exit 1
          fi
          cp "$SDL_LIB" "$OUT/libSDL2.a"

          echo "==> Libraries ready: $OUT/libfodpr.a, $OUT/libSDL2.a"
    postBuildScripts:
      - name: Copy Fonts
        shell: /bin/bash
        script: |
          set -euo pipefail
          cp "$SRCROOT/../examples/assets/DroidSansFallbackFull.ttf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          cp "$SRCROOT/../examples/assets/DejaVuSans.ttf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
