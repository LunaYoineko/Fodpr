name: FodprChat
options:
  bundleIdPrefix: com.fodpr.chat
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

targets:
  FodprChat:
    type: application
    platform: iOS
    sources:
      - path: App/stub.c
      # --- Nim ソース (閲覧・編集用。ビルドは preBuildScript が担当) ---
      - path: ../src/Fodpr.nim
        buildPhase: none
      - path: ../src/protocol.nim
        buildPhase: none
      - path: ../src/crypto.nim
        buildPhase: none
      - path: ../src/envelope.nim
        buildPhase: none
      - path: ../src/f2f
        buildPhase: none
        type: group
      - path: ../examples/chat_client.nim
        buildPhase: none
      - path: ../examples/fontrender.nim
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: FodprChat
        PRODUCT_BUNDLE_IDENTIFIER: com.fodpr.chat
        INFOPLIST_FILE: FodprChat/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_STYLE: Automatic
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - "$(SRCROOT)/out/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - $(inherited)
          - "-all_load"
          - "-lfodpr"
          - "-lSDL2"
          - "-framework AVFoundation"
          - "-framework AudioToolbox"
          - "-framework CoreGraphics"
          - "-framework CoreHaptics"
          - "-framework CoreMotion"
          - "-framework Foundation"
          - "-framework GameController"
          - "-framework Metal"
          - "-framework OpenGLES"
          - "-framework QuartzCore"
          - "-framework UIKit"
          - "-framework CoreAudio"
          - "-framework CoreVideo"
          - "-framework CoreBluetooth"
          - "-framework Security"
    preBuildScripts:
      - name: Build Libraries (Nim + SDL2)
        shell: /bin/bash
        script: |
          set -euo pipefail
          cd "$SRCROOT"
          source env.sh
          REPO="$(cd "$SRCROOT/.." && pwd)"
          export PATH="$HOME/.nimble/bin:$HOME/.choosenim/toolchains/nim-2.2.10/bin:$PATH"

          # PLATFORM_NAME: iphoneos (実機) / iphonesimulator (シミュレータ)
          PLATFORM="$PLATFORM_NAME"
          ARCH="${ARCHS%% *}"
          NIM_ARCH="$ARCH"
          if [ "$NIM_ARCH" = "x86_64" ]; then NIM_ARCH="amd64"; fi
          SYSROOT="$(xcrun --sdk "$PLATFORM" --show-sdk-path)"
          MIN="$MIN_IOS"
          if [ "$PLATFORM" = "iphonesimulator" ]; then
            MIN_FLAG="-mios-simulator-version-min=$MIN"
          else
            MIN_FLAG="-mios-version-min=$MIN"
          fi
          OUT="$SRCROOT/out/$PLATFORM"
          mkdir -p "$OUT"

          echo "==> Nim -> libfodpr.a ($PLATFORM/$ARCH)"
          if ! nim c -d:release --os:ios --cpu:"$NIM_ARCH" --app:staticlib --cc:clang --threads:on \
            --dynlibOverride:SDL2 \
            --nimcache:"$OUT/nimcache" \
            --path:"$REPO/src" \
            --passC:"-arch $ARCH -isysroot $SYSROOT -I$SDL_SRC/include $MIN_FLAG -Wno-unused-command-line-argument" \
            --out:"$OUT/libfodpr.a" \
            "$REPO/examples/chat_client.nim" >"$OUT/nim.log" 2>&1; then
            echo "ERROR: nim build failed:"
            cat "$OUT/nim.log"
            exit 1
          fi
          if [ ! -f "$OUT/libfodpr.a" ]; then
            echo "ERROR: libfodpr.a was not produced"
            exit 1
          fi

          echo "==> SDL2 -> libSDL2.a (prebuilt: $SDL_PREBUILT_DIR)"
          SDL_PRE="$SDL_PREBUILT_DIR/$PLATFORM/libSDL2.a"
          if [ ! -f "$SDL_PRE" ]; then
            echo "ERROR: prebuilt SDL2 not found: $SDL_PRE"
            echo "Run once to build SDL2 for device + simulator:"
            echo "  bash ios/setup_toolchain.sh"
            exit 1
          fi
          cp "$SDL_PRE" "$OUT/libSDL2.a"

          echo "==> Libraries ready: $OUT/libfodpr.a, $OUT/libSDL2.a"
    postBuildScripts:
      - name: Copy Fonts
        shell: /bin/bash
        script: |
          set -euo pipefail
          cp "$SRCROOT/../examples/assets/DroidSansFallbackFull.ttf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          cp "$SRCROOT/../examples/assets/DejaVuSans.ttf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
